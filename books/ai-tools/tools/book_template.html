<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} – AI Tools and Applications</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="icon" type="image/png" href="../assets/aikaryashala_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="book.css">
</head>
<body>
<!-- Generated by tools/build_book.py from book/*.md – edit the Markdown, then rebuild. -->

<header class="header">
  <div class="nav-shell">
    <a href="../index.html" aria-label="Home" class="nav-brand">
      <img src="../assets/aikaryashala_logo.png" alt="AI Karyashala logo">
    </a>
    <nav class="nav-links" aria-label="Main">
      <a href="../index.html">Home</a>
      <a href="../slides/index.html">Slides</a>
      <a href="index.html">AI Tools Book</a>
      <a href="../codexray/index.html">CodeXRay</a>
    </nav>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfNtm3WXYP0iq9jqokHn2Zx_W7OV_crYYHnH38HAlW0GGLdNA/viewform?usp=publish-editor" class="btn btn--primary nav-cta" target="_blank" rel="noopener noreferrer">Sign up</a>
  </div>
</header>

<div class="book">
  <aside class="book-side">
    <details class="toc-wrap">
      <summary>Chapters</summary>
      {{NAV}}
    </details>
    <script>
      // The chapter list is a collapsible box on phones and always open on wider screens.
      if (window.matchMedia("(min-width: 861px)").matches) document.querySelector(".toc-wrap").open = true;
    </script>
  </aside>

  <main class="book-main" id="top">
    <article class="chapter">
      <p class="eyebrow">{{EYEBROW}}</p>
      <h1>{{TITLE}}</h1>
      {{BODY}}
    </article>
    {{PREV_NEXT}}
  </main>
</div>

<footer class="site-footer">
  <div class="footer-content">
    <div class="footer-section">
      <h3>AI Karyashala</h3>
      <p class="footer-tagline">For first year students of GVPIHLR, Visakhapatnam</p>
    </div>
    <div class="footer-section">
      <h4>connect</h4>
      <p><a href="https://aikaryashala.com" target="_blank" rel="noopener noreferrer" class="footer-link">aikaryashala.com →</a></p>
    </div>
    <div class="footer-section">
      <h4>quick links</h4>
      <ul class="footer-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="../slides/index.html">Slides</a></li>
        <li><a href="index.html">AI Tools Book</a></li>
        <li><a href="../codexray/index.html">CodeXRay</a></li>
      </ul>
    </div>
  </div>
  <div class="footer-divider"></div>
  <p class="footer-credit">© 2026 AI Karyashala</p>
</footer>

</body>
</html>
