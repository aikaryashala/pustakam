<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} – AI Tools and Applications</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="icon" type="image/png" href="../assets/aikaryashala_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="book.css">
</head>
<body>
<!-- Generated by books/ai-tools/tools/build_book.py from books/ai-tools/src/*.md – edit the Markdown, then rebuild. -->

<div class="book">
  <aside class="book-side">
    <form class="book-search" role="search" autocomplete="off" onsubmit="return false">
      <label class="sr-only" for="book-search-input">Search the book</label>
      <div class="book-search-box">
        <input id="book-search-input" type="search" placeholder="Search the book…" aria-label="Search the book" aria-controls="book-search-results" aria-expanded="false">
        <button type="button" class="book-search-clear" aria-label="Clear search" hidden>×</button>
      </div>
      <div id="book-search-results" class="book-search-results" role="listbox" hidden></div>
    </form>
    <details class="toc-wrap">
      <summary>Chapters</summary>
      {{NAV}}
    </details>
    <script>
      // The chapter list is a collapsible box on phones and always open on wider screens.
      if (window.matchMedia("(min-width: 861px)").matches) document.querySelector(".toc-wrap").open = true;
    </script>
    <script src="search.js" defer></script>
  </aside>

  <main class="book-main" id="top">
    <article class="chapter">
      <p class="eyebrow">{{EYEBROW}}</p>
      <h1>{{TITLE}}</h1>
      {{BODY}}
    </article>
    {{PREV_NEXT}}
  </main>
</div>

</body>
</html>
